<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StreakLab</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="header">
            <div>
                <p class="brand">STREAKLAB</p>
                <h1>Build better habits.</h1>
                <p class="subtitle">
                    Stay consistent. Track your progress. Keep your streak alive.
                </p>
            </div>

            <div class="date" id="currentDate"></div>
        </header>


        <!-- Add Habit -->
        <section class="add-habit">
            <input
                type="text"
                id="habitInput"
                placeholder="What habit do you want to build?"
                maxlength="50"
            >

            <button id="addHabitBtn">
                + Add Habit
            </button>
        </section>


        <!-- Statistics -->
        <section class="stats">

            <div class="stat-card">
                <span>Total Habits</span>
                <strong id="totalHabits">0</strong>
            </div>

            <div class="stat-card">
                <span>Completed Today</span>
                <strong id="completedToday">0</strong>
            </div>

            <div class="stat-card">
                <span>Best Streak</span>
                <strong id="bestStreak">0</strong>
            </div>

        </section>


        <!-- Habits -->
        <main>

            <div class="section-header">
                <h2>Today's Habits</h2>
                <span id="habitCount">0 habits</span>
            </div>

            <div id="habitList" class="habit-list"></div>

            <div id="emptyState" class="empty-state">
                <div class="empty-icon">◎</div>
                <h3>No habits yet</h3>
                <p>Add your first habit and start building your streak.</p>
            </div>

        </main>

    </div>

    <script src="js/storage.js"></script>
    <script src="js/streaks.js"></script>
    <script src="js/habits.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
